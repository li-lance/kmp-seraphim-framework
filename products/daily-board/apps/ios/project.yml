name: DailyBoard
options:
  bundleIdPrefix: com.seraphim.dailyboard
targets:
  DailyBoard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - framework: ../../shared/task-board/build/bin/iosSimulatorArm64/debugFramework/TaskBoardShared.framework
        embed: false
      - framework: ../../shared/local-data-sql/build/bin/iosSimulatorArm64/debugFramework/LocalDataSql.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seraphim.dailyboard.ios
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
